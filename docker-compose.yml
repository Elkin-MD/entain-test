services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: entaintest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entaintest"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: entaintest
      DB_SSLMODE: disable
    command: ["migrate", "-direction", "up"]
    restart: "no"

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: entaintest
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
